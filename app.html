<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F2">
<title>Kapsel – odbiór butelek kaucyjnych</title>
<meta name="description" content="Kapsel: zamów odbiór butelek kaucyjnych spod drzwi. Wersja demo aplikacji dla klienta, kuriera i właściciela.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23186A42'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23F2B705' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:#E6EBE5;color:#14201A;font-family:'DM Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid #F2B705;outline-offset:2px}

.app{max-width:480px;margin:0 auto;min-height:100dvh;background:#F3F5F2;display:flex;flex-direction:column;position:relative}
@media (min-width:520px){.app{box-shadow:0 0 0 1px #DDE3DD,0 24px 60px rgba(20,32,26,.12)}}

/* układ */
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.between{justify-content:space-between}
.f1{flex:1;min-width:0}
.g2{gap:2px}.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.center{text-align:center}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* typografia */
.t12{font-size:12px}.t13{font-size:13px}.t14{font-size:14px}.t15{font-size:15px}.t18{font-size:18px}.t22{font-size:22px}
.b5{font-weight:500}.b7{font-weight:700}
.muted{color:#4D5A52}
.disp{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.5px}
.semi{font-family:'Bricolage Grotesque',sans-serif;font-weight:600}
.h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px;line-height:1.15}
.h2{margin:0;font-size:15px;font-weight:700}
.p{margin:0;line-height:1.45}

/* górny pasek */
.topbar{position:sticky;top:0;z-index:10;background:#F3F5F2;padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #E1E7E1}
.logo{width:28px;height:28px;border-radius:50%;background:#186A42;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.logo::after{content:"";width:13px;height:13px;border-radius:50%;border:3px solid #F2B705}
.word{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.5px}
.roles{display:flex;gap:4px;padding:4px;border-radius:14px;background:#E3E8E4}
.role{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:700;cursor:pointer;color:#14201A}
.role.on{background:#14201A;color:#FFFFFF}
.intro{position:relative;background:#FDF1C7;color:#3D2E00;border-radius:12px;padding:10px 40px 10px 12px;margin:12px 16px 0}
.intro-x{position:absolute;top:2px;right:2px;width:36px;height:36px;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:#3D2E00;border-radius:10px}

/* treść i nawigacja */
.main{flex:1;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
.nav{position:sticky;bottom:0;z-index:10;background:#FFFFFF;border-top:1px solid #DDE3DD;display:grid;padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
.tab{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:#4D5A52;background:none;border:0;cursor:pointer}
.tab.on{color:#186A42;font-weight:700}
.head{margin-left:-10px}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:12px;cursor:pointer;color:#14201A;flex-shrink:0}
.back:hover{background:#E3E8E4}

/* karty */
.card{background:#FFFFFF;border:1px solid #DDE3DD;border-radius:18px;padding:16px}
.card.list{padding:0;overflow:hidden;display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border:0;border-bottom:1px solid #E7ECE8;background:none;color:#14201A;text-align:left;width:100%}
.li:last-child{border-bottom:0}
button.li{cursor:pointer}
button.li:hover{background:#F7F9F6}
.link-card{display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;width:100%}
.link-card:hover{border-color:#186A42}
.hero{background:#186A42;color:#FFFFFF;border-radius:24px;padding:20px}
.on-green{color:#D6EDE0}
.ink-card{background:#14201A;color:#FFFFFF;border-radius:24px;padding:18px 20px 20px}
.on-ink{color:#C9D3CC}
.amber-text{color:#F2B705}
.mint{background:#E3F0E8;border-radius:18px;padding:12px 16px;color:#14201A}
.empty{background:#FFFFFF;border:1px dashed #C9D3CC;border-radius:18px;padding:18px;text-align:center}
.empty p{margin:0}
.empty p+p{margin-top:4px}
.success{align-items:flex-start}
.tick{width:48px;height:48px;border-radius:50%;background:#186A42;color:#FFFFFF;display:flex;align-items:center;justify-content:center;margin-bottom:4px}

/* przyciski */
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;border:0;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;padding:0 16px;white-space:nowrap}
.btn.sm{min-height:40px;border-radius:12px;font-size:14px;padding:0 12px}
.btn.big{min-height:54px;border-radius:16px;font-size:16px}
.btn:disabled,.btn.disabled{opacity:.45;cursor:not-allowed}
.primary{background:#186A42;color:#FFFFFF}.primary:not(:disabled):hover{background:#11502F}
.ghost{background:#F3F5F2;border:1px solid #DDE3DD;color:#14201A}.ghost:hover{border-color:#186A42}
.white{background:#FFFFFF;border:1px solid #DDE3DD;color:#14201A}.white:not(:disabled):hover{border-color:#186A42}
.dark{background:#14201A;color:#FFFFFF}.dark:hover{background:#26362D}
.danger{background:#A3261B;color:#FFFFFF}
.step{width:44px;height:44px;border-radius:12px;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;border:1px solid #DDE3DD}
.step.primary{border:0}
.step:disabled{opacity:.4;cursor:not-allowed}

/* wybory */
.slot{min-height:80px;padding:10px;border-radius:16px;border:1.5px solid #DDE3DD;background:#FFFFFF;color:#14201A;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:3px;cursor:pointer}
.slot.sel{background:#186A42;border-color:#186A42;color:#FFFFFF}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border-radius:16px;border:1.5px solid #DDE3DD;background:#FFFFFF;color:#14201A;text-align:left;cursor:pointer}
.opt.sel{border-color:#186A42}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #8A968E;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sel .radio{border-color:#186A42}
.sel .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:#186A42}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid #DDE3DD;background:#FFFFFF;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer}
.chip.sel{background:#14201A;border-color:#14201A;color:#FFFFFF}

/* formularze */
.input{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid #C9D3CC;background:#FFFFFF;font-size:16px}
.input:focus{border-color:#186A42;outline:none;box-shadow:0 0 0 3px rgba(24,106,66,.18)}
.input.num{width:96px;text-align:right;font-weight:700}
.input.bad{border-color:#A3261B}
select.input{appearance:auto}
.err{font-size:13px;color:#A3261B;font-weight:500}
.checkbox{width:22px;height:22px;accent-color:#186A42;margin:0}

/* statusy */
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;align-self:flex-start}
.row .pill{align-self:center}
.pill-amber{background:#F2B705;color:#14201A}
.pill-blue{background:#DCE8F7;color:#1D3F6E}
.pill-green{background:#E3F0E8;color:#11502F}
.pill-gray{background:#E3E8E4;color:#3B4740}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.soft-amber{background:#FDF1C7;color:#6B5000}
.soft-green{background:#E3F0E8;color:#186A42}
.soft-gray{background:#EEF1EE;color:#4D5A52}
.tile.green{background:#186A42;color:#FFFFFF}
.dot{width:24px;height:24px;border-radius:50%;background:#186A42;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dot.todo{background:#FFFFFF;border:2px solid #C9D3CC}
.vline{width:2px;flex:1;background:#B9D6C4;margin:2px 0}
.vline.todo{background:#DDE3DD}
.track{height:10px;border-radius:5px;overflow:hidden;background:#E3E8E4}
.track>div{height:10px;background:#186A42;border-radius:5px}
.seg{display:flex;gap:3px;height:14px;border-radius:7px;overflow:hidden}
.sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.photo-big{width:100%;border-radius:12px}
.photo-thumb{width:96px;height:72px;object-fit:cover;border-radius:10px}

/* skaner */
.cam{position:relative;height:300px;border-radius:24px;background:#0E1712;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam-frame{position:absolute;left:50%;top:44%;width:190px;height:190px;transform:translate(-50%,-50%);border:3px solid #F2B705;border-radius:18px;box-shadow:0 0 0 999px rgba(14,23,18,.35)}
.cam-label{position:absolute;left:12px;right:12px;bottom:14px;margin:0;text-align:center;font-size:14px;color:#FFFFFF}

/* naklejki */
.labels{display:grid;grid-template-columns:1fr;gap:10px}
.label{display:flex;align-items:center;gap:12px;background:#FFFFFF;border:1.5px dashed #8A968E;border-radius:14px;padding:10px 12px}
.label-brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:14px;color:#186A42}
.label-code{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.5px}

/* komunikat */
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#14201A;color:#FFFFFF;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;max-width:min(440px,calc(100vw - 32px));opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.ic{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* druk: tylko naklejki */
@media print{
  body{background:#FFFFFF}
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%}
  .labels{grid-template-columns:repeat(2,1fr);gap:6mm}
  .label{break-inside:avoid;border:1px dashed #000}
  .topbar,.nav,.toast{display:none}
}

</style>
</head>

<div id="root"></div>
