<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kapsel – mockup aplikacji</title>
<meta name="description" content="Mockup aplikacji do odbioru butelek kaucyjnych spod drzwi: ekrany klienta i kuriera.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
body{margin:0;background:#E6EBE5}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.k-page{min-height:100dvh;background:#E6EBE5;color:#14201A;font-family:'DM Sans',system-ui,sans-serif;padding:48px 16px 72px;box-sizing:border-box}
.k-page *,.k-page *::before,.k-page *::after{box-sizing:border-box}
.k-page a{color:inherit}
.k-head{max-width:1000px;margin:0 auto 56px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.k-title{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(30px,5vw,48px);line-height:1.05;letter-spacing:-1px}
.k-lead{margin:0;max-width:620px;font-size:17px;line-height:1.5;color:#4D5A52}
.k-sec{max-width:1760px;margin:0 auto 72px}
.k-sec-title{margin:0 0 28px;text-align:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;letter-spacing:-.5px}
.k-gallery{display:flex;flex-wrap:wrap;justify-content:center;gap:56px 48px;padding:10px}
.k-shot{margin:0;display:flex;flex-direction:column;align-items:center;gap:20px;scroll-margin-top:24px}
.k-label{font-size:15px;font-weight:700;color:#4D5A52}
.k-phone{width:390px;height:844px;border-radius:40px;overflow:hidden;background:#F3F5F2;color:#14201A;box-shadow:0 0 0 10px #14201A,0 28px 60px rgba(20,32,26,.28);display:flex;flex-direction:column;position:relative;text-align:left}
.k-foot{text-align:center;font-size:14px;color:#4D5A52}
@media (max-width:440px){.k-phone{zoom:.82}.k-gallery{gap:40px}}
@media (max-width:360px){.k-phone{zoom:.76}}

.k-main{flex:1;min-height:0;padding:24px 20px 16px;display:flex;flex-direction:column;gap:16px}
.k-main.k-tight{padding-top:16px;gap:14px}
.k-main.k-fill{padding-bottom:20px}
.k-row{display:flex;align-items:center}
.k-col{display:flex;flex-direction:column}
.k-between{justify-content:space-between}
.k-f1{flex:1}
.k-g2{gap:2px}.k-g4{gap:4px}.k-g6{gap:6px}.k-g8{gap:8px}.k-g10{gap:10px}.k-g12{gap:12px}
.k-t12{font-size:12px}.k-t13{font-size:13px}.k-t14{font-size:14px}.k-t15{font-size:15px}.k-t16{font-size:16px}
.k-b5{font-weight:500}.k-b7{font-weight:700}
.k-muted{color:#4D5A52}
.k-disp{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.5px}
.k-semi{font-family:'Bricolage Grotesque',sans-serif;font-weight:600}
.k-h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px}
.k-h2{margin:0;font-size:15px;font-weight:700}
.k-p{margin:0}

.k-logo{width:30px;height:30px;border-radius:50%;background:#186A42;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.k-logo::after{content:"";width:14px;height:14px;border-radius:50%;border:3px solid #F2B705}
.k-logo.k-dark{background:#14201A}
.k-word{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px}

.k-card{background:#FFFFFF;border:1px solid #DDE3DD;border-radius:18px}
.k-r22{border-radius:22px}.k-r24{border-radius:24px}
.k-pad{padding:16px}
.k-green{background:#186A42;color:#FFFFFF}
.k-ink{background:#14201A;color:#FFFFFF}
.k-amber{background:#F2B705;color:#14201A}
.k-mint{background:#E3F0E8;color:#11502F}
.k-on-green{color:#D6EDE0}
.k-on-ink{color:#C9D3CC}

.k-chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;background:#FFFFFF;border:1px solid #DDE3DD;color:#14201A;font-size:14px;font-weight:500;text-decoration:none}
.k-chip:hover{border-color:#186A42}
.k-btn{min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;border:0;font:inherit;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;padding:0 14px}
.k-big{min-height:52px;border-radius:16px;font-size:16px}
.k-primary{background:#186A42;color:#FFFFFF}.k-primary:hover{background:#11502F}
.k-ghost{background:#F3F5F2;border:1px solid #DDE3DD;color:#14201A}.k-ghost:hover{border-color:#186A42}
.k-white{background:#FFFFFF;border:1px solid #DDE3DD;color:#14201A}.k-white:hover{border-color:#186A42}
.k-dark{background:#14201A;color:#FFFFFF}.k-dark:hover{background:#26362D}
.k-outline-light{background:transparent;border:1.5px solid #D6EDE0;color:#FFFFFF}.k-outline-light:hover{background:#11502F}
.k-on-white{background:#FFFFFF;color:#11502F}
.k-pill{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.k-tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.k-tile.k-sm{width:38px;height:38px}
.k-tile.k-xs{width:36px;height:36px;border-radius:10px}
.k-soft-amber{background:#FDF1C7;color:#6B5000}
.k-soft-green{background:#E3F0E8;color:#186A42}
.k-back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#14201A;text-decoration:none;margin-left:-10px;border-radius:12px}
.k-back:hover{background:#E3E8E4}
.k-link-card{display:flex;align-items:center;gap:12px;padding:14px 16px;text-decoration:none;color:#14201A}
.k-link-card:hover{border-color:#186A42}

.k-tabbar{height:76px;flex-shrink:0;background:#FFFFFF;border-top:1px solid #DDE3DD;display:grid;padding:6px 8px 14px}
.k-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:12px;font-weight:500;color:#4D5A52;text-decoration:none;background:none;border:0;cursor:pointer}
.k-tab.k-on{color:#186A42;font-weight:700}
.k-tab:hover{color:#186A42}

.k-list{display:flex;flex-direction:column}
.k-li{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;border:0;border-bottom:1px solid #E7ECE8;background:none;color:#14201A;font:inherit;text-align:left;width:100%}
.k-li:last-child{border-bottom:0}
button.k-li{cursor:pointer;min-height:60px}
button.k-li:hover{background:#F7F9F6}

.k-dot{width:24px;height:24px;border-radius:50%;background:#186A42;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.k-line{width:2px;flex:1;background:#B9D6C4;margin:2px 0}
.k-track{height:10px;border-radius:5px;overflow:hidden}
.k-seg{display:flex;gap:3px;height:14px;border-radius:7px;overflow:hidden}
.k-sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.k-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border-radius:16px;border:1.5px solid #DDE3DD;background:#FFFFFF;color:#14201A;font:inherit;text-align:left;cursor:pointer}
.k-opt.k-sel{border-color:#186A42}
.k-radio{width:22px;height:22px;border-radius:50%;border:2px solid #8A968E;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.k-sel .k-radio{border-color:#186A42}
.k-sel .k-radio::after{content:"";width:10px;height:10px;border-radius:50%;background:#186A42}
.k-slot{min-height:80px;padding:10px;border-radius:16px;border:1.5px solid #DDE3DD;background:#FFFFFF;color:#14201A;font:inherit;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer}
.k-slot.k-sel{background:#186A42;border-color:#186A42;color:#FFFFFF}
.k-step{width:44px;height:44px;border-radius:12px;font:inherit;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}

.k-seg-ctl{display:flex;gap:4px;padding:4px;border-radius:16px;background:#E3E8E4}
.k-seg-btn{flex:1;min-height:44px;border:0;border-radius:12px;background:transparent;color:#14201A;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.k-seg-btn.k-sel{background:#14201A;color:#FFFFFF}
.k-cam{position:relative;height:270px;border-radius:24px;background:#0E1712;overflow:hidden;flex-shrink:0}
.k-corner{position:absolute;width:36px;height:36px;border:0 solid #F2B705}
.k-cam-label{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:14px;color:#FFFFFF}
.k-note{font-size:14px;padding:10px 12px;border-radius:12px;background:#E3F0E8;color:#11502F;font-weight:700}
.k-photo{width:64px;height:48px;border-radius:10px;background:#E3E8E4;border:1px dashed #8A968E;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#4D5A52;flex-shrink:0}

.k-ic{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.k-page :focus-visible{outline:3px solid #F2B705;outline-offset:2px}

</style>
</head>
<body>
<div id="root"></div>
